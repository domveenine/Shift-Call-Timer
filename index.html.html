<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title></title>
<style>

:root{
  --bg-1:#09111f;
  --bg-2:#101a2d;
  --bg-3:#16233d;
  --panel:rgba(12,20,35,.82);
  --panel-2:rgba(20,31,52,.92);
  --panel-3:rgba(26,39,64,.96);
  --surface:rgba(255,255,255,.04);
  --surface-2:rgba(255,255,255,.06);
  --text:#ecf3ff;
  --muted:#9eb0c8;
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.14);
  --shadow:0 24px 60px rgba(0,0,0,.34);
  --shadow-soft:0 10px 24px rgba(0,0,0,.18);

  --primary:#7bb0ff;
  --primary-2:#4e8df5;
  --danger:#ef8f95;
  --danger-2:#db5660;
  --accent:#f1cf7a;
  --accent-2:#e1b94c;
  --success:#85cfa5;
  --success-2:#4fb878;

  --tag-gen-bg:#3b82f6;
  --tag-gen-text:#ffffff;
  --tag-rad-bg:#fb923c;
  --tag-rad-text:#ffffff;
  --tag-ida-bg:#22c55e;
  --tag-ida-text:#062814;
  --tag-brk-bg:#fde047;
  --tag-brk-text:#2a2000;
  --tag-seg-bg:#8b5cf6;
  --tag-seg-text:#ffffff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter, Arial, Helvetica, sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(123,176,255,.18), transparent 28%),
    radial-gradient(circle at bottom right, rgba(139,92,246,.14), transparent 22%),
    radial-gradient(circle at center right, rgba(241,207,122,.10), transparent 18%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
  padding:24px 16px;
}
.app{
  position:relative;
  max-width:820px;
  margin:auto;
  background:linear-gradient(180deg, rgba(10,17,30,.82), rgba(16,26,45,.94));
  border:1px solid var(--border);
  border-radius:28px;
  padding:18px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  overflow:hidden;
}
.app::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg, rgba(255,255,255,.07), transparent 26%, transparent 74%, rgba(255,255,255,.03));
}
.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:14px;
}
.title-wrap{min-width:0;}
.title{
  font-size:26px;
  font-weight:900;
  letter-spacing:.01em;
  margin:0 0 6px;
}
.subtitle{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.35;
}
.header-badge{
  flex-shrink:0;
  border:1px solid var(--border);
  background:rgba(255,255,255,.045);
  padding:10px 12px;
  border-radius:16px;
  text-align:right;
  box-shadow:var(--shadow-soft);
}
.header-badge .mini-label{
  display:block;
  color:var(--muted);
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:.12em;
  margin-bottom:4px;
}
.header-badge .mini-value{
  font-size:14px;
  font-weight:800;
}
.status-wrap{
  display:flex;
  justify-content:center;
  margin:8px 0 14px;
}
.status{
  min-width:132px;
  text-align:center;
  padding:9px 14px;
  border-radius:999px;
  font-weight:900;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  border:1px solid rgba(255,255,255,.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 24px rgba(0,0,0,.18);
}
.status.call{background:rgba(228,109,116,.16); color:#ffdbe0;}
.status.idle{background:rgba(100,185,135,.18); color:#d8ffea;}
.status.other{background:rgba(230,191,89,.14); color:#fff0c0;}
.status.segment{background:rgba(167,139,250,.12); color:#ddd6fe;}

.section{
  background:linear-gradient(180deg, var(--panel-2), var(--panel-3));
  border:1px solid var(--border);
  border-radius:22px;
  padding:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.main-action{margin-bottom:10px;}
.main-button{
  width:100%;
  border:none;
  border-radius:16px;
  padding:13px 14px;
  font-size:15px;
  font-weight:900;
  letter-spacing:.02em;
  cursor:pointer;
  transition:transform .16s ease, filter .16s ease, box-shadow .16s ease, opacity .16s ease;
  color:#fff;
  box-shadow:0 10px 24px rgba(0,0,0,.20);
  min-height:48px;
}
.main-button:hover:not(:disabled), .aux-button:hover:not(:disabled){
  transform:translateY(-1px);
  filter:brightness(1.04);
}
.main-button:active:not(:disabled), .aux-button:active:not(:disabled){
  transform:translateY(0);
}
.main-button.start{background:linear-gradient(180deg,#22c55e,#15803d);}
.main-button.stop{background:linear-gradient(180deg,#ef4444,#b91c1c);}

.controls-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.aux-button{
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  padding:10px 8px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  transition:transform .16s ease, filter .16s ease, box-shadow .16s ease, opacity .16s ease;
  min-height:42px;
  line-height:1.05;
  box-shadow:0 8px 18px rgba(0,0,0,.14);
}
.aux-button:disabled{opacity:.45;cursor:not-allowed;}
.rad{background:linear-gradient(180deg,#fb923c,#ea580c); color:#ffffff;}
.rad.active{box-shadow:0 0 0 2px rgba(255,255,255,.16) inset, 0 8px 18px rgba(0,0,0,.18);}
.break{background:linear-gradient(180deg,#fde047,#eab308); color:#2a2000;}
.download{background:linear-gradient(180deg,#64748b,#475569); color:#ffffff;}
.reset{background:linear-gradient(180deg,#374151,#111827); color:#ffffff;}
.segment{background:linear-gradient(180deg,#a78bfa,#7c3aed); color:#ffffff;}

.counter-tile{
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.counter-value{
  font-size:28px;
  font-weight:800;
  line-height:1;
  color:var(--text);
}
.mini-subtext{
  margin-top:4px;
  font-size:10px;
  color:var(--muted);
  line-height:1.2;
}

.dashboard{
  display:grid;
  grid-template-columns:1.35fr .8fr;
  gap:12px;
  margin-top:12px;
}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow-soft);
}
.timer-card{display:flex; flex-direction:column; justify-content:center; min-height:170px;}
.label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:8px;
  text-transform:uppercase;
  letter-spacing:.12em;
}
.time{
  font-size:48px;
  line-height:1;
  font-weight:900;
  letter-spacing:.02em;
  margin-bottom:10px;
  font-variant-numeric:tabular-nums;
}
.note{
  font-size:13px;
  color:var(--muted);
  line-height:1.4;
}
.quick-stats{
  display:grid;
  gap:10px;
}
.stat-tile{
  padding:12px;
  border-radius:16px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.035);
}
.stat-tile .mini-label{
  display:block;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  margin-bottom:6px;
}
.stat-tile .mini-value{
  font-size:14px;
  font-weight:800;
}
.bottom-actions{
  margin-top:12px;
  display:flex;
  gap:8px;
}
.bottom-actions .aux-button{flex:1; min-height:42px;}
.helper{
  margin:10px 2px 0;
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}
.log-shell{
  margin-top:16px;
  background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
  border:1px solid var(--border);
  border-radius:20px;
  padding:12px;
}
.table-wrap{
  margin-top:8px;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:auto;
  background:rgba(255,255,255,.02);
}
table{width:100%; border-collapse:collapse; font-size:12px;}
th,td{
  padding:10px 8px;
  border-bottom:1px solid rgba(255,255,255,.06);
  text-align:left;
  vertical-align:middle;
  white-space:normal; word-break:break-word;
}
th{
  position:sticky;
  top:0;
  background:#19253a;
  color:#bfd0e7;
  text-transform:uppercase;
  font-size:9px;
  letter-spacing:.10em;
}
.notes-cell{min-width:190px; white-space:normal;}
.notes-input{
  width:100%;
  min-width:170px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.08);
  background:#0f172a;
  color:var(--text);
  padding:8px 10px;
  font-size:11px;
  outline:none;
}
.notes-input::placeholder{color:var(--muted);}
.notes-input:focus, .tag-select:focus{
  border-color:rgba(110,168,254,.65);
  box-shadow:0 0 0 3px rgba(110,168,254,.16);
}
tbody tr:nth-child(even){background:rgba(255,255,255,.015);}
.empty{color:var(--muted); font-style:italic; text-align:center; padding:16px 10px;}
.tag-select{
  width:100%;
  min-width:74px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  padding:7px 10px;
  font-size:10px;
  font-weight:900;
  outline:none;
  text-align:center;
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.legend-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  padding:7px 11px;
  font-size:11px;
  font-weight:800;
  border:1px solid rgba(255,255,255,.05);
}
.legend-gen{background:var(--tag-gen-bg); color:var(--tag-gen-text);}
.legend-rad{background:var(--tag-rad-bg); color:var(--tag-rad-text);}
.legend-ida{background:var(--tag-ida-bg); color:var(--tag-ida-text);}
.legend-brk{background:var(--tag-brk-bg); color:var(--tag-brk-text);}
.legend-seg{background:var(--tag-seg-bg); color:var(--tag-seg-text);}

.log-toggle{
  cursor:pointer;
  font-size:13px;
  font-weight:800;
  color:var(--text);
  margin:0;
  list-style:none;
}
.log-toggle::-webkit-details-marker{display:none;}
.log-toggle::before{content:"▾ "; color:var(--muted);}
details:not([open]) > .log-toggle::before{content:"▸ ";}

@media (max-width:680px){
  .header{flex-direction:column;}
  .header-badge{text-align:left; width:100%;}
  .dashboard{grid-template-columns:1fr;}
  .time{font-size:42px;}
}
@media (max-width:520px){
  body{padding:14px;}
  .app{padding:14px; border-radius:22px;}
  .section{padding:12px;}
  .title{font-size:22px;}
  .controls-grid{grid-template-columns:1fr;}
  .bottom-actions{flex-direction:column;}
  .time{font-size:36px;}
}


/* Mobile optimization */
@media (max-width:680px){
  body{
    padding:10px;
  }
  .app{
    max-width:100%;
    border-radius:20px;
    padding:12px;
  }
  .section,
  .card,
  .log-shell{
    border-radius:18px;
  }
  .header{
    gap:12px;
    margin-bottom:12px;
  }
  .status-wrap{
    margin:6px 0 12px;
  }
  .status{
    width:100%;
    max-width:none;
  }
  .controls-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .controls-grid .aux-button:last-child{
    grid-column:1 / -1;
  }
  .dashboard{
    gap:10px;
  }
  .quick-stats{
    grid-template-columns:repeat(3,minmax(0,1fr));
    display:grid;
  }
  .stat-tile{
    min-width:0;
    padding:10px;
  }
  .counter-value{
    font-size:24px;
  }
}

@media (max-width:520px){
  body{
    padding:8px;
  }
  .app{
    padding:10px;
    border-radius:18px;
  }
  .title{
    font-size:20px;
    line-height:1.15;
  }
  .subtitle,
  .note{
    font-size:12px;
  }
  .main-button{
    min-height:50px;
    font-size:16px;
  }
  .controls-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }
  .controls-grid .aux-button{
    min-height:46px;
    font-size:12px;
    padding:10px 6px;
  }
  .controls-grid .aux-button:last-child{
    grid-column:1 / -1;
  }
  .time{
    font-size:34px;
  }
  .quick-stats{
    grid-template-columns:1fr;
    gap:8px;
  }
  .stat-tile .mini-value{
    font-size:16px;
  }
  .bottom-actions{
    position:sticky;
    bottom:0;
    padding-top:10px;
    background:linear-gradient(180deg, rgba(16,26,45,0), rgba(16,26,45,.96) 35%);
    z-index:5;
  }
  .bottom-actions .aux-button{
    min-height:46px;
  }
  .table-wrap{
    overflow:visible;
    border:none;
    background:transparent;
  }
  table,
  thead,
  tbody,
  th,
  td,
  tr{
    display:block;
    width:100%;
  }
  thead{
    display:none;
  }
  tbody{
    display:grid;
    gap:10px;
  }
  tbody tr{
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:8px;
  }
  tbody tr:nth-child(even){
    background:rgba(255,255,255,.03);
  }
  tbody td{
    border-bottom:none;
    padding:7px 6px;
  }
  tbody td:not(.notes-cell){
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  tbody td::before{
    content:attr(data-label);
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
    flex:0 0 auto;
  }
  .notes-cell{
    padding-top:10px;
  }
  .notes-cell::before{
    content:attr(data-label);
    display:block;
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:6px;
  }
  .tag-select,
  .notes-input{
    min-width:0;
  }
  .empty{
    text-align:left;
  }
}

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title-wrap">
      <h1 class="title">Shift Call Timer</h1>
      <p class="subtitle"></p>
    </div>
    <div class="header-badge">
      <span class="mini-label"></span>
      <span class="mini-value"></span>
    </div>
  </div>

  <div class="status-wrap">
    <div id="status" class="status other">Ready</div>
  </div>

  <div class="section">
    <div class="main-action">
      <button id="toggleBtn" class="main-button start">Start Call</button>
    </div>

    <div class="controls-grid">
      <button id="radBtn" class="aux-button rad" disabled>RAD</button>
      <button id="breakBtn" class="aux-button break">Break</button>
      
      <button id="segmentBtn" class="aux-button segment">Segment</button>
    </div>

    <div class="dashboard">
      <div class="card timer-card">
        <div class="label">Current Timer</div>
        <div id="timer" class="time">00:00:00</div>
        <div id="note" class="note">Ready to begin.</div>
      </div>
      <div class="quick-stats">
        <div class="stat-tile counter-tile">
          <span class="mini-label">Calls Handled</span>
          <span id="callCounter" class="mini-value counter-value">0</span>
          <span class="mini-subtext"></span>
        </div>
        <div class="stat-tile">
          <span class="mini-label">RAD Calls</span>
          <span id="radCounter" class="mini-value">0</span>
          <span class="mini-subtext"></span>
        </div>
        <div class="stat-tile">
          <span class="mini-label">Avg Handle Time</span>
          <span id="avgHandleTime" class="mini-value">00:00:00</span>
          <span class="mini-subtext"></span>
        </div>
      </div>
    </div>

    <div class="bottom-actions">
      <button id="endShiftBtn" class="aux-button download">End</button>
      <button id="resetBtn" class="aux-button reset">Reset</button>
    </div>

  </div>

  <details open class="log-shell"><summary class="log-toggle">Running Log</summary><div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Start</th>
          <th>End</th>
          <th>Duration</th>
          <th>Tag</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody id="log">
        <tr id="emptyRow"><td colspan="7" class="empty">No segments logged yet.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
let mode = "ready";
let startTime = null;
let interval = null;
let count = 0;
let isRAD = false;
let rows = [];
let segmentActive = false;
let segmentStart = null;

const toggleBtn = document.getElementById("toggleBtn");
const radBtn = document.getElementById("radBtn");
const breakBtn = document.getElementById("breakBtn");
const statusEl = document.getElementById("status");
const noteEl = document.getElementById("note");
const timerEl = document.getElementById("timer");
const logEl = document.getElementById("log");
const endShiftBtn = document.getElementById("endShiftBtn");
const resetBtn = document.getElementById("resetBtn");
const segmentBtn = document.getElementById("segmentBtn");
const STORAGE_KEY = "shiftCallTimerState_v1";

function saveState(){
  try{
    const state = {
      mode,
      startTime,
      count,
      isRAD,
      rows,
      segmentActive,
      segmentStart
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err){
    console.warn("Unable to save timer state.", err);
  }
}

function clearSavedState(){
  try{
    localStorage.removeItem(STORAGE_KEY);
  } catch (err){
    console.warn("Unable to clear timer state.", err);
  }
}

function restoreState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;

    const state = JSON.parse(raw);
    if(!state || typeof state !== "object") return false;

    mode = state.mode || "ready";
    startTime = typeof state.startTime === "number" ? state.startTime : null;
    count = typeof state.count === "number" ? state.count : 0;
    isRAD = !!state.isRAD;
    rows = Array.isArray(state.rows) ? state.rows : [];
    segmentActive = !!state.segmentActive;
    segmentStart = typeof state.segmentStart === "number" ? state.segmentStart : null;

    logEl.innerHTML = "";
    if(rows.length === 0){
      logEl.innerHTML = '<tr id="emptyRow"><td colspan="7" class="empty">No segments logged yet.</td></tr>';
    } else {
      [...rows].forEach(record => addRow(record, true));
    }

    if(mode === "call" || mode === "break" || mode === "idle"){
      if(startTime !== null){
        clearInterval(interval);
        interval = setInterval(tick, 250);
        tick();
      }

      if(mode === "call"){
        setStatus("On Call", "call");
        setNote(isRAD ? "This call is marked as RAD." : "Call timer is running.");
      } else if(mode === "break"){
        setStatus("On Break", "other");
        setNote("Break timer is running.");
      } else if(mode === "idle"){
        setStatus("Idle", "idle");
        setNote("Idle timer is running between calls.");
      }
    } else {
      mode = "ready";
      startTime = null;
      clearInterval(interval);
      interval = null;
      tick();
      setStatus("Ready", "other");
      setNote("Ready to begin.");
    }

    segmentBtn.textContent = segmentActive ? "Segment Stop" : "SEG";
    updateButtons();
    updateCallCounter();
  updateRadCounter();
  updateAvgHandleTime();
    return true;
  } catch (err){
    console.warn("Unable to restore timer state.", err);
    return false;
  }
}

function fmt(ms){
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 3600)).padStart(2, '0') + ":" +
         String(Math.floor((s % 3600) / 60)).padStart(2, '0') + ":" +
         String(s % 60).padStart(2, '0');
}

function fmtDate(ts){
  return new Date(ts).toLocaleDateString([], {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  });
}

function fmtTime(ts){
  return new Date(ts).toLocaleTimeString([], {
    hour: 'numeric',
    minute: '2-digit',
    second: '2-digit'
  });
}

function setStatus(text, type){
  statusEl.textContent = text;
  statusEl.className = "status " + type;
}

function setNote(text){
  noteEl.textContent = text;
}

function applyTagColor(el){
  const val = el.value;
  if(val === "GEN"){
    el.style.background = getComputedStyle(document.documentElement).getPropertyValue('--tag-gen-bg');
    el.style.color = getComputedStyle(document.documentElement).getPropertyValue('--tag-gen-text');
  } else if(val === "RAD"){
    el.style.background = "linear-gradient(180deg,#fb923c,#ea580c)";
    el.style.color = "#ffffff";
    el.style.background = getComputedStyle(document.documentElement).getPropertyValue('--tag-rad-bg');
    el.style.color = getComputedStyle(document.documentElement).getPropertyValue('--tag-rad-text');
  } else if(val === "IDA"){
    el.style.background = getComputedStyle(document.documentElement).getPropertyValue('--tag-ida-bg');
    el.style.color = getComputedStyle(document.documentElement).getPropertyValue('--tag-ida-text');
    el.style.background = getComputedStyle(document.documentElement).getPropertyValue('--tag-ida-bg');
    el.style.color = getComputedStyle(document.documentElement).getPropertyValue('--tag-ida-text');
  } else if(val === "BRK"){
    el.style.background = "linear-gradient(180deg,#fde047,#eab308)";
    el.style.color = "#2a2000";
    el.style.background = getComputedStyle(document.documentElement).getPropertyValue('--tag-brk-bg');
    el.style.color = getComputedStyle(document.documentElement).getPropertyValue('--tag-brk-text');
  } else if(val === "SEG" || val === "SEG"){
    el.style.background = "linear-gradient(180deg,#a78bfa,#7c3aed)";
    el.style.color = "#ffffff";
    el.style.color = "#ffffff";
  } else {
    el.style.background = "#0f172a";
    el.style.color = "#ffffff";
  }
}

function updateButtons(){
  if(mode === "call"){
    toggleBtn.textContent = "Stop";
    toggleBtn.className = "main-button stop";
    radBtn.disabled = false;
    breakBtn.disabled = true;
  } else {
    toggleBtn.textContent = "Start";
    toggleBtn.className = "main-button start";
    radBtn.disabled = true;
    breakBtn.disabled = false;
  }

  breakBtn.textContent = mode === "break" ? "End Break" : "Break";
  radBtn.textContent = isRAD ? "RAD ✓" : "RAD";
  radBtn.classList.toggle("active", isRAD && mode === "call");
  segmentBtn.textContent = segmentActive ? "Segment Stop" : "SEG";
}

function tick(){
  if(startTime !== null){
    timerEl.textContent = fmt(Date.now() - startTime);
  } else {
    timerEl.textContent = "00:00:00";
  }
}

function updateCallCounter(){
  const total = rows.filter(r => r.tag === "GEN" || r.tag === "RAD").length;
  const el = document.getElementById("callCounter");
  if(el){
    el.textContent = String(total);
  }
}

function updateRadCounter(){
  const total = rows.filter(r => r.tag === "RAD").length;
  const el = document.getElementById("radCounter");
  if(el){
    el.textContent = String(total);
  }
}

function updateAvgHandleTime(){
  const callRows = rows.filter(r => r.tag === "GEN" || r.tag === "RAD");
  const el = document.getElementById("avgHandleTime");
  if(!el){
    return;
  }
  if(callRows.length === 0){
    el.textContent = "00:00:00";
    return;
  }

  let totalSeconds = 0;
  for(const row of callRows){
    const parts = String(row.duration || "00:00:00").split(":").map(Number);
    if(parts.length === 3 && parts.every(n => !Number.isNaN(n))){
      totalSeconds += (parts[0] * 3600) + (parts[1] * 60) + parts[2];
    }
  }

  const avgSeconds = Math.round(totalSeconds / callRows.length);
  const hours = String(Math.floor(avgSeconds / 3600)).padStart(2, "0");
  const minutes = String(Math.floor((avgSeconds % 3600) / 60)).padStart(2, "0");
  const seconds = String(avgSeconds % 60).padStart(2, "0");
  el.textContent = `${hours}:${minutes}:${seconds}`;
}





function beginMode(nextMode){
  mode = nextMode;
  startTime = Date.now();
  clearInterval(interval);
  interval = setInterval(tick, 250);
  tick();

  if(nextMode === "call"){
    isRAD = false;
    setStatus("On Call", "call");
    setNote("Call timer is running.");
  } else if(nextMode === "break"){
    setStatus("On Break", "other");
    setNote("Break timer is running.");
  } else if(nextMode === "idle"){
    setStatus("Idle", "idle");
    setNote("Idle timer is running between calls.");
  } else {
    setStatus("Ready", "other");
    setNote("Ready to begin.");
  }

  updateButtons();
  saveState();
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getTagOptions(selectedTag){
  const tags = ["GEN", "RAD", "IDA", "BRK", "SEG"];
  return '<select class="tag-select">' + tags.map(tag =>
    '<option value="' + tag + '"' + (selectedTag === tag ? ' selected' : '') + '>' + tag + '</option>'
  ).join('') + '</select>';
}

function addRow(record, skipStore){
  if(!skipStore){
    rows.unshift(record);
  }

  const emptyRow = document.getElementById("emptyRow");
  if(emptyRow) emptyRow.remove();

  const tr = document.createElement("tr");
  tr.dataset.id = record.id;
  tr.innerHTML = `
    <td data-label="#">${record.id}</td>
    <td data-label="Date">${record.date}</td>
    <td data-label="Start">${record.start}</td>
    <td data-label="End">${record.end}</td>
    <td data-label="Duration">${record.duration}</td>
    <td data-label="Tag">${getTagOptions(record.tag || "GEN")}</td>
    <td class="notes-cell" data-label="Notes"><input class="notes-input" type="text" maxlength="120" placeholder="Optional note" value="${escapeHtml(record.notes || "")}" /></td>
  `;

  logEl.prepend(tr);

  const select = tr.querySelector(".tag-select");
  if(select){
    select.dataset.id = record.id;
    applyTagColor(select);
    select.addEventListener("change", (e) => {
      const row = rows.find(r => String(r.id) === String(e.target.dataset.id));
      if(row) row.tag = e.target.value;
      applyTagColor(e.target);
      updateCallCounter();
  updateRadCounter();
  updateAvgHandleTime();
      saveState();
    });
  }

  const notesInput = tr.querySelector(".notes-input");
  if(notesInput){
    notesInput.dataset.id = record.id;
    notesInput.addEventListener("input", (e) => {
      const row = rows.find(r => String(r.id) === String(e.target.dataset.id));
      if(row) row.notes = e.target.value;
      saveState();
    });
  }

  if(!skipStore){
    saveState();
  }
  updateCallCounter();
  updateRadCounter();
  updateAvgHandleTime();
}

function logSegment(startedAt, endedAt, duration, tag){
  count += 1;
  addRow({
    id: count,
    date: fmtDate(startedAt),
    start: fmtTime(startedAt),
    end: fmtTime(endedAt),
    duration,
    tag,
    notes: ""
  });
}

function endCurrentMode(){
  if(startTime === null) return;

  const endedAt = Date.now();
  const startedAt = startTime;
  const dur = fmt(endedAt - startedAt);

  if(mode === "call"){
    logSegment(startedAt, endedAt, dur, isRAD ? "RAD" : "GEN");
    beginMode("idle");
    return;
  }

  if(mode === "break"){
    logSegment(startedAt, endedAt, dur, "BRK");
    beginMode("idle");
    return;
  }

  if(mode === "idle"){
    const durationMs = endedAt - startedAt;
    if(durationMs >= 10000){
      logSegment(startedAt, endedAt, dur, "IDA");
    }
    mode = "ready";
    startTime = null;
    clearInterval(interval);
    interval = null;
    tick();
    setStatus("Ready", "other");
    setNote("Ready to begin.");
    isRAD = false;
    updateButtons();
    saveState();
  }
}

toggleBtn.addEventListener("click", () => {
  if(mode === "call"){
    endCurrentMode();
  } else {
    if(mode === "idle" || mode === "break"){
      endCurrentMode();
    }
    beginMode("call");
  }
});

radBtn.addEventListener("click", () => {
  if(mode !== "call" || radBtn.disabled) return;
  isRAD = !isRAD;
  setNote(isRAD ? "This call is marked as RAD." : "Call timer is running.");
  updateButtons();
  saveState();
});

breakBtn.addEventListener("click", () => {
  if(mode === "call") return;

  if(mode === "break"){
    endCurrentMode();
  } else {
    if(mode === "idle"){
      endCurrentMode();
    }
    beginMode("break");
  }
});

function generatePdfReport() {
  if(rows.length === 0){
    alert("No log entries to download yet.");
    return;
  }

  const rowsInOrder = [...rows].reverse();

  const shiftStartDate = rowsInOrder.length
    ? rowsInOrder[0].date
    : new Date().toLocaleDateString();

  function parseDurationToSeconds(duration){
    const parts = String(duration).split(":").map(Number);
    if(parts.length !== 3 || parts.some(isNaN)) return 0;
    return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
  }

  function formatSeconds(totalSeconds){
    const safe = Math.max(0, Math.round(totalSeconds));
    const hours = Math.floor(safe / 3600);
    const minutes = Math.floor((safe % 3600) / 60);
    const seconds = safe % 60;
    return String(hours).padStart(2, "0") + ":" +
           String(minutes).padStart(2, "0") + ":" +
           String(seconds).padStart(2, "0");
  }

  const callRows = rowsInOrder.filter(r => r.tag === "GEN" || r.tag === "RAD");
  const idleRows = rowsInOrder.filter(r => r.tag === "IDA");
  const totalCallSeconds = callRows.reduce((sum, r) => sum + parseDurationToSeconds(r.duration), 0);
  const totalIdleSeconds = idleRows.reduce((sum, r) => sum + parseDurationToSeconds(r.duration), 0);

  const avgCallHandleTime = callRows.length ? formatSeconds(totalCallSeconds / callRows.length) : "00:00:00";
  const avgIdleTime = idleRows.length ? formatSeconds(totalIdleSeconds / idleRows.length) : "00:00:00";
  const totalRadCalls = rowsInOrder.filter(r => r.tag === "RAD").length;
  const totalCallsIncludingRad = callRows.length;

  const summaryHtml = [
    '<div class="summary-grid">',
      '<div class="summary-card">',
        '<div class="summary-label">Average Call Handle Time</div>',
        '<div class="summary-value">' + avgCallHandleTime + '</div>',
      '</div>',
      '<div class="summary-card">',
        '<div class="summary-label">Average Idle Time</div>',
        '<div class="summary-value">' + avgIdleTime + '</div>',
      '</div>',
      '<div class="summary-card">',
        '<div class="summary-label">Total RAD Calls</div>',
        '<div class="summary-value">' + totalRadCalls + '</div>',
      '</div>',
      '<div class="summary-card">',
        '<div class="summary-label">Total Calls Including RAD</div>',
        '<div class="summary-value">' + totalCallsIncludingRad + '</div>',
      '</div>',
    '</div>'
  ].join('');

  const rowsHtml = rowsInOrder.map(r => `
    <tr>
      <td>${r.id}</td>
      <td>${r.date}</td>
      <td>${r.start}</td>
      <td>${r.end}</td>
      <td>${r.duration}</td>
      <td>${r.tag || ""}</td>
      <td>${escapeHtml(r.notes || "")}</td>
    </tr>
  `).join("");

  const reportHtml = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8" />
      <title></title>
      <style>
        body{font-family:Arial,Helvetica,sans-serif;padding:24px;color:#111;}
        h1{margin:0 0 6px;font-size:24px;}
        .note{margin-bottom:16px;color:#444;}
        .summary-grid{
          display:grid;
          grid-template-columns:repeat(2, minmax(0, 1fr));
          gap:12px;
          margin:0 0 20px;
        }
        .summary-card{
          border:1px solid #d1d5db;
          border-radius:12px;
          padding:12px 14px;
          background:#f9fafb;
          break-inside:avoid;
        }
        .summary-label{
          font-size:12px;
          color:#4b5563;
          margin-bottom:6px;
          text-transform:uppercase;
          letter-spacing:.04em;
        }
        .summary-value{
          font-size:24px;
          font-weight:700;
          color:#111827;
        }
        table{width:100%;border-collapse:collapse;font-size:12px;}
        th,td{border:1px solid #d1d5db;padding:8px;text-align:left;vertical-align:top;word-break:break-word;}
        td:last-child, th:last-child{width:28%;}
        th{background:#f3f4f6;}
      </style>
    </head>
    <body>
      <h1>Call Log Report</h1>
      <div class="note"><strong>Shift Start Date:</strong> ${shiftStartDate}</div>
      <div class="note">All times are in Mountain Time (MT).</div>
      ${summaryHtml}
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Start</th>
            <th>End</th>
            <th>Duration</th>
            <th>Tag</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <script>
        setTimeout(function(){ window.print(); }, 250);
      <\/script>
    </body>
    </html>
  `;

  const win = window.open("", "_blank");
  if(!win){
    alert("Please allow pop-ups to export the PDF.");
    return;
  }

  win.document.open();
  win.document.write(reportHtml);
  win.document.close();
}

endShiftBtn.addEventListener("click", () => {
  if(mode === "call" || mode === "break" || mode === "idle"){
    endCurrentMode();
  }
  generatePdfReport();
});

segmentBtn.addEventListener("click", () => {
  if(segmentActive){
    if(segmentStart !== null){
      const now = Date.now();
      const dur = fmt(now - segmentStart);
      logSegment(segmentStart, now, dur, "SEG");
    }
    segmentActive = false;
    segmentStart = null;

    // revert status based on mode
    if(mode === "call"){
      setStatus("On Call", "call");
    } else if(mode === "break"){
      setStatus("On Break", "other");
    } else if(mode === "idle"){
      setStatus("Idle", "idle");
    } else {
      setStatus("Ready", "other");
    }

  } else {
    segmentActive = true;
    segmentStart = Date.now();
    setStatus("In Segment", "segment");
  }
  updateButtons();
  saveState();
});

resetBtn.addEventListener("click", () => {
  mode = "ready";
  startTime = null;
  count = 0;
  isRAD = false;
  rows = [];
  segmentActive = false;
  segmentStart = null;
  clearInterval(interval);
  interval = null;
  timerEl.textContent = "00:00:00";
  logEl.innerHTML = '<tr id="emptyRow"><td colspan="7" class="empty">No segments logged yet.</td></tr>';
  setStatus("Ready", "other");
  setNote("Ready to begin.");
  updateButtons();
  updateCallCounter();
  updateRadCounter();
  updateAvgHandleTime();
  clearSavedState();
});

if(!restoreState()){
  setStatus("Ready", "other");
  setNote("Ready to begin.");
  updateButtons();
  tick();
  updateCallCounter();
  updateRadCounter();
  updateAvgHandleTime();
}

window.addEventListener("beforeunload", saveState);
</script>
</body>
</html>
